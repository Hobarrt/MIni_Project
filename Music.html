<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>songs for you</title>
    <link rel="stylesheet" href="music.css">
</head>
<body>

    
    <section class="scene scene-home" id="musicHome">
        <img class="scene-bg" src="img/music-home.png" alt="songs for you">
        <div class="home-dim-overlay" id="homeDimOverlay"></div>

        <a class="hotspot back-hotspot" href="page1.html" aria-label="back to hub"></a>

        <button class="hotspot song-hotspot hotspot-sempurna" id="hotspotSempurna" data-index="0" aria-label="play Sempurna"></button>
        <button class="hotspot song-hotspot hotspot-1000x" id="hotspot1000x" data-index="1" aria-label="play 1000x"></button>

        <span class="found-mark found-mark-sempurna hidden" id="foundMarkSempurna">✧</span>
        <span class="found-mark found-mark-1000x hidden" id="foundMark1000x">✧</span>

        <div class="final-layer hidden" id="finalLayer">
            <p class="final-text" id="finalText1"></p>
            <button class="final-btn hidden" id="finalBtn">one more thing ♡</button>
            <a class="final-btn hidden" id="backHubBtn" href="page1.html">back to hub ♡</a>
        </div>
    </section>

    
    <section class="scene scene-detail hidden" id="songDetail">
        <div class="stage" id="stage">

            <img class="song-bg" id="songBg" src="img/song-bg.jpg" alt="">

            <div class="vinyl-label-spin" id="vinylLabel"></div>

            <button class="hotspot detail-back" id="detailBackBtn" aria-label="back"></button>

            <div class="progress-bar" id="progressBar">
                <div class="progress-track"></div>
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-knob" id="progressKnob"></div>
            </div>
            <span class="time time-current" id="timeCurrent">00:00</span>
            <span class="time time-duration" id="timeDuration">00:00</span>

            <button class="ctrl ctrl-side ctrl-prev" id="prevBtn" aria-label="previous song">
                <svg viewBox="0 0 24 24"><path d="M6 6h2.4v12H6zM10 12l8-6v12z"/></svg>
            </button>

            <button class="ctrl ctrl-play" id="playBtn" aria-label="play or pause">
                <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
            </button>

            <button class="ctrl ctrl-side ctrl-next" id="nextBtn" aria-label="next song">
                <svg viewBox="0 0 24 24"><path d="M15.6 6H18v12h-2.4zM6 18V6l8 6z"/></svg>
            </button>

            <span class="heart-mark" id="heartMark">♥</span>

            <button class="hotspot why-hotspot" id="whyBtn" aria-label="why this song?"></button>

            <div class="why-card hidden" id="whyCard">
                <button class="why-close" id="whyClose">×</button>
                <p class="why-label">why this song?</p>
                <p class="why-text" id="whyText"></p>
                <button class="why-close-btn" id="whyCloseBtn">close ♡</button>
            </div>
        </div>

        <audio id="audioPlayer" preload="metadata"></audio>
    </section>

    <script src="music.js"></script>
</body>
</html>
